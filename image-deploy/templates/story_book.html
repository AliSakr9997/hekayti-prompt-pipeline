<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hekayti Story</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #111;
            scroll-behavior: smooth;
        }

        /* Snap Scrolling Setup */
        .scroll-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            scroll-snap-align: start;
        }

        /* 1. The blurred background layer (30% blur as requested) */
        .bg-blur {
            position: absolute;
            top: -10%; left: -10%; right: -10%; bottom: -10%;
            background-size: cover;
            background-position: center;
            filter: blur(30px);
            -webkit-filter: blur(30px);
            z-index: 1;
            opacity: 0.7; /* Darkened slightly so text stays readable */
        }

        /* 2. The main content container */
        .content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 3. The Central Image */
        .story-image {
            max-width: 90%;
            max-height: 55vh;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            object-fit: contain;
            margin-bottom: 30px;
            /* Optional subtle magical border matching your poster glow */
            border: 2px solid rgba(255, 255, 255, 0.2); 
        }

        /* 4. The 100% Blurred Text Box */
        .text-box {
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        /* 5. The Text with 10% Stroke (Simulated via text-shadow for cross-browser compat) */
        .text-content {
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.6;
            margin: 0;
            /* Creates the black stroke/outline around white text */
            text-shadow: 
                -1px -1px 0 #000,
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px 4px 10px rgba(0,0,0,0.8);
        }

        /* Final Promo Page Customization */
        .promo-bg {
            background-color: #6C63FF; /* Deep Purple Hekayti branded color */
            z-index: 1;
        }

    </style>
</head>
<body>
    <div class="scroll-container">
        
        <!-- Generate Content Pages (Cover + Scenes) -->
        {% for page in scenes %}
        <div class="page-container">
            <!-- Background Image Blurred -->
            <div class="bg-blur" style="background-image: url('{{ page.image_data }}');"></div>
            
            <div class="content-layer">
                <!-- Centered Main Image -->
                <img class="story-image" src="{{ page.image_data }}" alt="Story Image" />
                
                <!-- Heavy Blurred Text Box -->
                <div class="text-box">
                    <p class="text-content">{{ page.scene_text }}</p>
                </div>
            </div>
        </div>
        {% endfor %}

        <!-- Final Page: The Purple Poster -->
        <!-- Since we don't have the explicit image URL for your poster yet, 
             I've built the fallback code. If you have the image URL, you can just insert it here. -->
        <div class="page-container">
            <div class="bg-blur promo-bg"></div>
            <div class="content-layer" style="justify-content: center; text-align: center; background: #7C4DFF;">
                <!-- Try to load final_poster_url if passed from FastAPI, else generic text -->
                {% if final_poster_url %}
                    <img src="{{ final_poster_url }}" style="max-width: 100%; max-height: 100vh; object-fit: contain;" />
                {% else %}
                    <h1 style="color: white; font-size: 4rem; margin-bottom: 0;">حكايتي</h1>
                    <p style="color: white; font-size: 1.8rem; font-weight: bolder; margin-top: 5px;">خلي ابنك بطل القصة</p>
                {% endif %}
            </div>
        </div>
        
    </div>
</body>
</html>
