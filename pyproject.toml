[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hekayti-pipeline"
version = "0.1.0"
description = "Provider-neutral, safety-focused character-consistency image pipeline primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["hekayti*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

